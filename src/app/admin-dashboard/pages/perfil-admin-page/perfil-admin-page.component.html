<div class="p-6 bg-base-100 min-h-screen max-w-4xl mx-auto space-y-10">

  <!-- Encabezado -->
  <div>
    <h1 class="text-3xl font-bold text-primary">👤 Mi perfil</h1>
    <p class="text-base-content">Configuración de tu cuenta, nombre, contraseña y más.</p>
  </div>

  <!-- Información general -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">

    <!-- Foto de perfil -->
    <div class="space-y-4">
      <div class="avatar">
        <div class="w-32 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
          <img src="https://i.pravatar.cc/150?img=3" alt="Foto de perfil" />
        </div>
      </div>
      <input type="file" class="file-input file-input-bordered w-full" />
    </div>

    <!-- Información básica -->
    <div class="md:col-span-2">
      <form class="space-y-4">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="form-control">
            <label class="label">
              <span class="label-text">Nombre</span>
            </label>
            <input type="text" class="input input-bordered w-full" placeholder="Elvis" />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text">Apellido</span>
            </label>
            <input type="text" class="input input-bordered w-full" placeholder="Briceño" />
          </div>
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text">Correo electrónico</span>
          </label>
          <input type="email" class="input input-bordered w-full" placeholder="correo@ejemplo.com" />
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text">Tipo de usuario</span>
          </label>
          <select class="select select-bordered w-full">
            <option selected>Administrador</option>
            <option>Supervisor</option>
            <option>Operador</option>
            <option>Invitado</option>
          </select>
        </div>

        <div class="form-control mt-4">
          <button class="btn btn-primary w-full">💾 Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Cambiar contraseña -->
  <div class="card bg-base-200 shadow">
    <div class="card-body space-y-4">
      <h2 class="card-title">🔐 Cambiar contraseña</h2>

      <form class="space-y-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Contraseña actual</span>
          </label>
          <input type="password" class="input input-bordered w-full" placeholder="••••••••" />
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text">Nueva contraseña</span>
          </label>
          <input type="password" class="input input-bordered w-full" placeholder="**********" />
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text">Repetir nueva contraseña</span>
          </label>
          <input type="password" class="input input-bordered w-full" placeholder="**********" />
        </div>

        <button type="submit" class="btn btn-accent w-full">🔄 Cambiar contraseña</button>
      </form>
    </div>
  </div>

</div>
